<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>육성전기</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="여섯 영웅이 찢어진 하늘을 닫는 5막 횡스크롤 비행슈팅 게임">
<meta name="theme-color" content="#07050f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="육성전기">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&display=swap">
<style>
/* 단일 화면 아케이드 캐비닛: 먹빛 바탕 위에 16:9 픽셀 화면 + 고해상도 HUD를 겹친다 */
:root{--ink:#07050f;--bezel:#141024;--gold:#e7c063;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--gold);overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  font-family:'Do Hyeon','Malgun Gothic','Apple SD Gothic Neo',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{width:100%;height:100%;display:grid;place-items:center}
#cab{position:relative;outline:2px solid var(--bezel);box-shadow:0 0 60px rgba(120,70,220,.18)}
canvas{position:absolute;left:0;top:0;display:block}
#g{image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
#u:focus-visible{outline:2px solid var(--gold)}
[hidden]{display:none!important}
#dock{display:none}
body.dock #wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
body.dock #dock{display:flex;flex:1;width:100%;min-height:0;gap:10px;padding-bottom:max(6px,env(safe-area-inset-bottom,0px));box-sizing:border-box}
#cab{flex:none}
#pad{flex:1;min-width:0;display:grid;place-items:center;text-align:center;padding:12px;border:1px dashed rgba(231,192,99,.45);border-radius:14px;color:#a79fbc;font-size:15px;line-height:1.5;word-break:keep-all;touch-action:none;background:#110c20}
#pad.on{background:#1c1436;border-color:var(--gold)}
#btns{flex:none;width:42%;display:grid;grid-template-columns:1fr;gap:8px}
.tb{touch-action:none;border:1px solid rgba(231,192,99,.55);border-radius:14px;background:#1b1430;color:#fff6d0;font:inherit;font-size:18px;padding:0 6px;min-height:48px;-webkit-tap-highlight-color:transparent}
.tb.on{background:var(--gold);color:var(--ink)}
#bPause{font-size:14px;min-height:36px;color:#a79fbc}
@supports (height:100dvh){html,body{height:100dvh}}
/* 터치 기기 가로 화면: 게임이 높이를 전부 쓰도록 여백을 없앤다 */
@media (orientation:landscape) and (pointer:coarse){
  body{padding-block:0;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  #cab{outline:0;box-shadow:none}
}
</style>
</head>
<body>
<div id="wrap"><div id="cab">
  <canvas id="g" width="640" height="360" aria-hidden="true"></canvas>
  <canvas id="u" tabindex="0" aria-label="육성전기 게임 화면. 방향키로 이동, Z 샷, X 고유기술 홀드, C 필살기"></canvas>
</div>
<div id="dock">
  <div id="pad">여기를 드래그해 이동<br>가로로 돌리면 더 크게 보여요</div>
  <div id="btns">
    <button class="tb" id="bShot" type="button" hidden>샷</button>
    <button class="tb" id="bSkill" type="button">기술</button>
    <button class="tb" id="bBomb" type="button">필살기</button>
    <button class="tb" id="bPause" type="button" hidden>일시정지</button>
  </div>
</div></div>
<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/art2.js"></script>
<script src="js/world.js"></script>
<script src="js/heroes.js"></script>
<script src="js/foes.js"></script>
<script src="js/bosses.js"></script>
<script src="js/stages.js"></script>
<script src="js/main.js"></script>
<script>
// 브라우저 탭에서 가로로 플레이할 때 첫 터치에 전체화면을 시도한다 (설치 앱은 이미 전체화면)
(function(){
  var tried=false;
  var standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  addEventListener('pointerup',function(e){
    if(tried||standalone||e.pointerType!=='touch'||innerHeight>innerWidth)return;
    var el=document.documentElement;if(!el.requestFullscreen||document.fullscreenElement)return;
    tried=true;el.requestFullscreen({navigationUI:'hide'}).catch(function(){});
  });
  if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
</script>
</body>
</html>
